<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>予定表</title>
  <link rel="stylesheet" href="font.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="schedules">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__top">
        <button class="icon-btn" aria-label="メニュー">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="brand">
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__name">BASEBALL</span>
        </div>
      </div>

      <nav class="nav">
        <a class="nav__item" data-nav="dashboard" href="/-/index.html"><span class="nav__label">ダッシュボード</span></a>
        <a class="nav__item" data-nav="schedules" href="/-/schedules.html"><span class="nav__label">予定表</span></a>
        <a class="nav__item" data-nav="menus" href="/-/menus.html"><span class="nav__label">練習メニュー</span></a>
        <a class="nav__item" data-nav="members" href="/-/members.html"><span class="nav__label">部員管理</span></a>
        <a class="nav__item" data-nav="records" href="/-/records.html"><span class="nav__label">個人成績</span></a>
        <a class="nav__item" data-nav="absences" href="/-/absences.html"><span class="nav__label">欠席連絡</span></a>
      </nav>

      <!-- 左下：ログインUI -->
      <div class="sidebar__bottom">
        <div class="user">
          <div class="user__avatar">裕</div>
          <div class="user__meta">
            <div class="user__name" id="auth-name">未ログイン</div>
            <div class="user__role" id="auth-email"></div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn--primary" id="btn-login" type="button">ログイン</button>
              <button class="btn" id="btn-logout" type="button">ログアウト</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ログインDialog -->
      <dialog id="dlg-login">
        <div class="dialog__head">
          <div class="dialog__title">ログイン</div>
          <button class="btn btn--ghost" data-close-dialog="dlg-login" type="button">閉じる</button>
        </div>
        <form id="form-login">
          <div class="dialog__body">
            <div class="field">
              <label>メールアドレス</label>
              <input id="loginEmail" type="email" required placeholder="例：xxx@gmail.com" />
            </div>
            <div class="field">
              <label>表示名（任意）</label>
              <input id="loginName" placeholder="例：裕貴 井上" />
            </div>
            <div class="muted" style="margin-top:10px">
              ※GitHub Pages版は簡易ログインです（完全なアクセス制限ではありません）。
            </div>
          </div>
          <div class="dialog__foot">
            <button class="btn btn--primary" type="submit">ログイン</button>
          </div>
        </form>
      </dialog>
    </aside>

    <main class="main">
      <header class="page-head">
        <div class="page-head__title">
          <span class="title-dot" aria-hidden="true"></span>
          <h1>SCHEDULE</h1>
        </div>
        <p class="page-head__sub">予定表・カレンダー</p>
      </header>

      <div class="divider"></div>

      <!-- カレンダーヘッダー -->
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" type="button" aria-label="前の月">‹</button>
        <div class="cal-title" id="cal-title">2026年2月</div>
        <button class="cal-nav" id="cal-next" type="button" aria-label="次の月">›</button>
      </div>

      <!-- 曜日 -->
      <div class="cal-dow">
        <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>

      <!-- カレンダー本体 -->
      <div class="cal-grid" id="cal-grid"></div>

      <!-- 選択日の予定一覧 -->
      <section class="section">
        <div class="section__head" style="margin-top:18px">
          <span class="section-dot" aria-hidden="true"></span>
          <h2 id="day-title">2026年2月1日(日)</h2>
        </div>
        <div class="section__rule"></div>

        <div class="toolbar" style="margin-top:12px">
          <div class="toolbar__left muted">この日の予定</div>
          <div class="toolbar__right">
            <button class="btn btn--primary" id="btn-open-schedule" type="button">＋ 予定を追加</button>
          </div>
        </div>

        <div style="margin-top:12px" id="day-list"></div>
      </section>

      <!-- 追加/編集 dialog -->
      <dialog id="dlg-schedule">
        <div class="dialog__head">
          <div class="dialog__title" id="dlg-schedule-title">予定を追加</div>
          <button class="btn btn--ghost" data-close-dialog="dlg-schedule" type="button">閉じる</button>
        </div>
        <form id="form-schedule">
          <div class="dialog__body">
            <div class="field">
              <label>日付 *</label>
              <input id="schDate" type="date" required />
            </div>
            <div class="field">
              <label>種類</label>
              <select id="schType">
                <option value="practice">練習</option>
                <option value="game">試合</option>
                <option value="meeting">ミーティング</option>
                <option value="other">その他</option>
              </select>
            </div>
            <div class="field">
              <label>タイトル *</label>
              <input id="schTitle" placeholder="例：練習（守備）" required />
            </div>
            <div class="field">
              <label>時間</label>
              <div style="display:flex; gap:10px">
                <input id="schStart" type="time" />
                <input id="schEnd" type="time" />
              </div>
            </div>
            <div class="field">
              <label>メモ</label>
              <textarea id="schNote" placeholder="集合場所、持ち物など"></textarea>
            </div>
          </div>
          <div class="dialog__foot">
            <button class="btn btn--primary" id="btn-schedule-save" type="submit">保存</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
