<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BASEBALL | Dashboard</title>

  <link rel="stylesheet" href="font.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="dashboard">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__top">
        <button class="icon-btn" aria-label="メニュー">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="brand">
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__name">BASEBALL</span>
        </div>
      </div>

      <!-- ★リンク付きナビ（ここ重要） -->
<nav class="nav">
  <a class="nav__item" data-nav="dashboard" href="/-/index.html"><span class="nav__label">ダッシュボード</span></a>
  <a class="nav__item" data-nav="schedules" href="/-/schedules.html"><span class="nav__label">予定表</span></a>
  <a class="nav__item" data-nav="menus" href="/-/menus.html"><span class="nav__label">練習メニュー</span></a>
  <a class="nav__item" data-nav="members" href="/-/members.html"><span class="nav__label">部員管理</span></a>
  <a class="nav__item" data-nav="records" href="/-/records.html"><span class="nav__label">個人成績</span></a>
  <a class="nav__item" data-nav="absences" href="/-/absences.html"><span class="nav__label">欠席連絡</span></a>
</nav>


      <div class="sidebar__bottom">
        <div class="user">
          <div class="user__avatar">裕</div>
          <div class="user__meta">
            <div class="user__name">裕貴 井上</div>
            <div class="user__role">部員</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="page-head">
        <div class="page-head__title">
          <span class="title-dot" aria-hidden="true"></span>
          <h1>DASHBOARD</h1>
        </div>
        <p class="page-head__sub">裕貴 井上さん、ようこそ。部活動の最新情報を確認できます。</p>
      </header>

      <div class="divider"></div>

      <section class="cards">
        <article class="card">
          <div class="card__value" id="stat-members">0</div>
          <div class="card__label">部員数</div>
        </article>

        <article class="card">
          <div class="card__value" id="stat-week">0</div>
          <div class="card__label">今週の予定</div>
        </article>

        <article class="card">
          <div class="card__value" id="stat-menus">0</div>
          <div class="card__label">練習メニュー</div>
        </article>
      </section>

      <section class="section">
        <div class="section__head">
          <span class="section-dot" aria-hidden="true"></span>
          <h2>今週の予定</h2>
        </div>
        <div class="section__rule"></div>

        <!-- ★ここにJSで予定が描画されます -->
        <div class="empty-box" id="week-box">
          <p>今週の予定はありません</p>
        </div>
      </section>
    </main>
  </div>

  <!-- ★これが無いと「機能」が動きません -->
  <script src="app.js"></script>
</body>
</html>
